# Default model: Anthropic claude-sonnet-5 — the "smart" mode of the provider
# routing layer (/root/.hermes/routing.yaml, skills/provider-routing). Sonnet is
# the sustainable everyday default; claude-opus-5 stays available as the "deep"
# route and is reached explicitly via `nicks-stack-route run deep --confirm`,
# never automatically. ANTHROPIC_API_KEY is resolved from
# 1Password at every hermes start (secrets.onepassword map below), so no key is
# baked here — the same key contract as every other integration in this stack.
#
# Nous is still fully supported, just no longer the default: keep/redo the
# key-less OAuth with `hermes auth add nous --type oauth`, then set
#   default: openai/gpt-5.5 / provider: nous
#   base_url: https://inference-api.nousresearch.com/v1
# Dewey runs gpt-5.6-sol via openai-codex (ChatGPT OAuth) — to switch, run
# `hermes auth add openai-codex` then set default: gpt-5.6-sol / provider: openai-codex.
# OpenRouter stays available as a future optional provider (OPENROUTER_API_KEY
# is already in the 1Password map) — set provider: openrouter to route through it.
# Interactive default  (v1.1.12 — routing axis B)
#
# Sonnet, deliberately. This is the model that answers Taylor directly, and the
# questions he actually asks it — acquisition analysis, insurance/tax reasoning,
# "what should I do about this email" — are the ones where being wrong is
# expensive. The cheap tier is reached by DELEGATION (SOUL.md → Model routing),
# where Sonnet decides what is mechanical and hands that part to Haiku. Deciding
# per task, with the full question in view, beats classifying the message before
# anyone has read it — and it costs no extra call.
#
# To make the whole interactive path cheap instead, set this to
# claude-haiku-4-5. It is one line and it works. It is NOT the default because
# then the model choosing when to escalate is the weaker one, which is the wrong
# way round: a Haiku that fails to recognise a hard question just answers it
# badly, and Taylor has no signal that it happened.
model:
  default: claude-sonnet-5
  provider: anthropic
  base_url: https://api.anthropic.com
providers:
  vercel-ai-gateway:
    name: Vercel AI Gateway
    base_url: https://ai-gateway.vercel.sh/v1
    key_env: AI_GATEWAY_API_KEY
    transport: chat_completions
    default_model: meta/muse-spark-1.1
  meta-model-api:
    name: Meta Model API
    api: https://api.meta.ai/v1
    key_env: MODEL_API_KEY
    transport: codex_responses
    default_model: muse-spark-1.1
    context_length: 1048576
  # Gemini via Google's OpenAI-compatible endpoint. This Hermes ships no
  # Gemini plugin, so it is registered with the documented custom-provider
  # convention (same key shape as vercel-ai-gateway) and addressed as
  # `--provider custom:gemini`. Verified: POST .../v1beta/openai/chat/completions
  # answers requests (400 on a bad key, not 404). default_model is a starting
  # point — nicks-stack-provider-doctor verifies it against the live model list
  # and reports which id it actually used.
  gemini:
    name: Google Gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    transport: chat_completions
    default_model: gemini-3.6-flash
  # Ollama on this machine. Local, key-less (OLLAMA_API_KEY is a placeholder
  # the daemon ignores — it is not a secret). No default_model: the model is
  # always passed per call with -m, because what is pulled is machine-specific.
  ollama:
    name: Ollama (local)
    base_url: http://127.0.0.1:11434/v1
    key_env: OLLAMA_API_KEY
    transport: chat_completions
agent:
  max_turns: 60
  service_tier: fast
  verify_on_stop: false
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
