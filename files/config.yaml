  provider: ''
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
approvals:
  mode: false
  mcp_reload_confirm: false
  destructive_slash_confirm: false
hooks_auto_accept: true
code_execution:
