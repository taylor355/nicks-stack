# ==========================================================================
# Nick's Stack — provider routing map  (deployed to /root/.hermes/routing.yaml)
# ==========================================================================
# The single inspectable source of truth for "which mode uses which model".
# Nothing here is inferred at runtime: `nicks-stack-route show` reads this file
# and reports the mode, provider, model and reason verbatim. There is no
# automatic or opaque routing in v1 — a mode changes only when someone asks
# for it.
#
# MECHANISM (verified against this repo, not assumed)
#   Per-call routing uses the Hermes CLI flags that the AgentPhone bridge
#   already uses in production:
#       hermes chat -Q --source <src> -m <model> --provider <provider> -q <prompt>
#   (files/agentphone-bridge/agentphone_bridge.py:1270-1276, and
#    skills/productivity/agentphone-setup/references/inbound-webhook-bridge.md:144
#    — which also records that HERMES_INFERENCE_MODEL does NOT work for
#    `hermes chat`, only for `hermes -z` and `--tui`. Use the flags.)
#
#   `smart` is the gateway's own configured model, so it costs nothing extra:
#   Jack simply answers. Every other model-backed mode is a one-shot
#   subprocess, which is why switching modes needs no gateway restart and
#   cannot disturb Telegram, sessions or memory.
#
# PROVIDER NAMES are Hermes plugin names, confirmed enabled in
# files/config.yaml → plugins.enabled: anthropic-provider, openrouter-provider,
# xai-provider, openai-codex-provider. Providers declared in the `providers:`
# block of config.yaml are addressed as `custom:<name>` instead.
#
# MODEL IDS below are Anthropic API model IDs, used by provider `anthropic`
# against https://api.anthropic.com (files/config.yaml → model.base_url).
# Verify them on the machine before trusting them:
#   nicks-stack-route probe --mode fast
# ==========================================================================
version: 1

# The mode used when nobody has selected one. `smart` is the gateway default,
# so this matches model.default in config.yaml on purpose.
default_mode: smart

# Selected mode lives under state/, which platform/update.sh treats as
# preserved user data — a deployment never resets the chosen mode.
state_file: /root/.hermes/state/nicks-stack-mode.json

modes:

  fast:
    provider: anthropic
    model: claude-haiku-4-5
    key_env: ANTHROPIC_API_KEY
    execution: hermes-oneshot
    tools: true
    fallback: smart
    summary: Routine email, calendar, summaries, classification, formatting.
    why: >-
      Least expensive Anthropic model that still supports the tool-calling loop
      Hermes needs ($1/$5 per MTok vs $3/$15 for smart). Chosen for volume work
      where the answer is mechanical rather than judgemental.

  smart:
    provider: anthropic
    model: claude-sonnet-5
    key_env: ANTHROPIC_API_KEY
    execution: gateway-default
    tools: true
    fallback: null
    summary: Default runtime. Business reasoning, Notion, Gmail, Calendar, Drive, CRM.
    why: >-
      Cost-conscious high quality, deliberately not the premium Opus tier. This
      is the model the gateway itself runs (config.yaml → model.default), so
      answering in this mode adds no subprocess and no extra latency.

  deep:
    provider: anthropic
    model: claude-opus-5
    key_env: ANTHROPIC_API_KEY
    execution: hermes-oneshot
    tools: true
    fallback: smart
    requires_confirmation: true
    summary: Executive strategy, acquisition analysis, complex insurance/tax/legal/financial reasoning.
    why: >-
      Premium tier, reserved for work where being wrong is expensive. Never
      selected automatically: `nicks-stack-route run deep` refuses without
      --confirm, and no cheaper mode may escalate into it.

  build:
    execution: specialist-cli
    specialists:
      - name: claude-code
        binary: claude
        auth_check: claude auth status
        invoke: claude -p '<task>' --max-turns <N>
        preferred: true
      - name: codex
        binary: codex
        auth_check: codex login status
        invoke: codex exec '<task>'
        preferred: false
    requires_approval: true
    fallback: null
    summary: Software engineering and repository changes.
    why: >-
      Claude Code and Codex are locally authenticated CLI execution
      environments, not API providers — a consumer subscription must never be
      driven through an API key. Hermes stays the conductor and reviews the
      diff. See the coding-agent-routing skill for the full policy; this router
      only reports which specialist is available and never runs one itself.

  local:
    execution: ollama
    provider: custom:ollama
    model: null                # resolved at run time from installed models
    key_env: null              # local daemon, no credential
    fallback: null
    summary: Local Ollama — private, free, no data leaves the machine.
    why: >-
      Routes to the Ollama daemon on this machine. The model is whichever one
      is pulled locally (discovered from /api/tags), so nothing is assumed. If
      the daemon is down or no model is pulled, this mode fails cleanly with
      "not installed/configured" and never falls back to a paid route.

# --------------------------------------------------------------------------
# Providers — what `nicks-stack-provider-doctor` validates end to end.
# Each entry is credential + catalog + one real inference. Model ids here are
# CANDIDATES: the doctor checks every one against the vendor's own live list
# and reports what it actually used, so a stale pin degrades to a clear
# message instead of a silent wrong route.
# --------------------------------------------------------------------------
providers:

  anthropic:
    display: Anthropic
    provider: anthropic          # plugins.enabled → anthropic-provider
    key_env: ANTHROPIC_API_KEY
    enabled: true
    models:                      # the three ids the modes above route to
      - claude-haiku-4-5
      - claude-sonnet-5
      - claude-opus-5

  openrouter:
    display: OpenRouter
    provider: openrouter         # plugins.enabled → openrouter, openrouter-provider
    key_env: OPENROUTER_API_KEY
    enabled: true
    # Verified present in https://openrouter.ai/api/v1/models on 2026-08-02.
    # The catalog is public, so the doctor re-verifies these on every run.
    models:
      - anthropic/claude-sonnet-5
      - google/gemini-3.6-flash
      - meta-llama/llama-3.3-70b-instruct

  gemini:
    display: Gemini
    # No Gemini plugin ships with this Hermes, so Gemini is registered as a
    # custom provider (config.yaml → providers.gemini) against Google's
    # OpenAI-compatible endpoint and addressed as custom:<name>, exactly like
    # providers.meta-model-api. Verified: POST /v1beta/openai/chat/completions
    # answers (400 on a bad key, not 404), and /v1beta/models lists the ids.
    provider: custom:gemini
    key_env: GEMINI_API_KEY
    enabled: true
    models:
      - gemini-3.6-flash
      - gemini-3.5-flash
    # If none of the candidates exist for this account, the doctor selects the
    # newest flash-class model the key can actually see and says so.

  ollama:
    display: Ollama
    provider: custom:ollama      # config.yaml → providers.ollama (local, key-less)
    host: http://127.0.0.1:11434
    enabled: true
    # Preference order. Whatever is listed here is only used if it is actually
    # pulled; otherwise the first chat-capable installed model wins. Embedding
    # models (nomic-embed-text and friends) are never selected for inference —
    # they cannot answer a prompt.
    models:
      - qwen3:4b
