# ==========================================================================
# Taylor AI Platform — declared platform spec
# ==========================================================================
# Deployed to /root/.hermes/platform.yaml. This is the DECLARED side of the
# platform: what version this is, which components ship with it, who the agent
# is meant to be, and which company builds inherit it.
#
# The DETECTED side — what is actually installed and running on a given
# machine — is written at deploy time to /opt/nicks-stack/platform-manifest.json
# by `jack manifest`. Together they are the canonical source of truth:
#
#   platform.yaml            what this release IS      (in git, reviewed)
#   platform-manifest.json   what this machine HAS     (generated, per host)
#
# Bump `version` for a platform release; bump a component version when that
# component changes behaviour. `jack version` reads both.
# ==========================================================================
name: Taylor AI Platform
version: 1.1.23
released: 2026-08-09
status: frozen
description: >-
  v1.1.23 teaches Jack to run the family's paperwork. The Covey household
  captures documents in the TK Family app and drops scans into Google Drive;
  Jack now reads each one, renames it to the house pattern, files it into Covey
  Files by folder id, and PROPOSES the task or bill rather than creating it. The
  TK Family MCP server (23 tools) is wired with its token as a runtime secret,
  never inline. The every-minute poll Taylor asked for runs as tkfamily_scan.py
  behind Hermes' cron wake gate: three HTTP calls a minute with no model in the
  loop, and the agent wakes only when something is actually waiting, with
  re-wake and failure backoff so a document Jack cannot clear does not summon
  him sixty times an hour. Three facts were verified against the live tree
  rather than assumed. Covey Files is owned by taylor@tk-holdings.com, and
  Composio's default Drive account is the personal one, so omitting `account`
  acts as a non-owner while the Outlaw account cannot read the tree at all.
  Rename and move are one GOOGLEDRIVE_UPDATE_FILE_METADATA_PATCH call, and it is
  Drive v2, so the field is `title` and not `name`. And TK Family's own
  organize_drive_file matches folders by name substring, which is unusable in a
  tree where "Bills and Receipts" occurs fifteen times. The folder table lives
  once in platform.yaml; verify.sh fails if the skill's copy drifts from it.
  v1.1.22 points Jack at the databases where follow-ups actually live. In the
  first brief he could not re-confirm "Follow up with Rich - CA Property" and
  said so rather than guessing, which was the right behaviour but the wrong
  outcome: he had searched page titles instead of querying the database holding
  the rows. Tasks DB (2685a2ef) carries 36 such rows and ATC Tasks DB (2a15a2ef)
  carries Anderson's, both discovered by walking the parents of the follow-up
  pages. SOUL.md now names both ids, tells him to use NOTION_QUERY_DATABASE, and
  to check status and date fields rather than assuming a row is closed. That is
  what makes follow-up radar reliable instead of best-effort.
  v1.1.21 tunes the escalation rule from Taylor's first real correction, and adds
  Signl. The morning brief worked end to end (three calendars, three inboxes,
  four items surfaced, one recommendation) but ORDERED them wrong: it led with a
  Rho bank-reconnect notice and put Smith Steelworks third. Rho was worth
  including and was not the headline. Smith Steelworks is the first prospect of
  Signl, the new venture Taylor is building with his brother Andrew Covey, so it
  should have led. SOUL.md now carries the general rule (strategic beats
  administratively urgent: a vendor deadline in red capitals is loud, not
  important; a live prospect conversation is quiet and usually matters more) plus
  an explicit six-tier ordering, and records the correction that produced it.
  Signl, Andrew Covey and Smith Steelworks are added to the companies, the people
  and the Notion record. Write authority is unchanged and deliberately so: Jack
  drafts, Taylor sends.
  v1.1.20 puts Jack's Notion context where it belongs and encodes how to choose
  a parent. v1.1.19 filed it under "Household HQ" because the parent was taken
  as the first workspace-level page a generic search returned, which is not a
  decision. A targeted search finds five: TK Holdings - Command Center, Gibson
  Command Center, Outlaw Industrial Command Center, Household HQ, and Jack
  Access Hub. TK Holdings is the entity that sits above the others by Taylor's
  own description, so the hub is now "Jack 55 Context" under TK Holdings, with
  the five context pages recreated beneath it and a link index on the hub. The
  misfiled originals are archived. SOUL.md now states the constraint (the Notion
  API refuses root-level page creation and MOVE_PAGE cannot target the root, so
  a parent is always a real choice), lists the workspace-level pages, and rules
  that new context pages go under Jack 55 Context, that TK Holdings is the
  fallback parent, and that business material never goes under Household HQ.
  v1.1.19 moves the record from Obsidian to Notion, because Taylor does not use
  Obsidian. The reference material seeded in v1.1.18 (people per company, the
  companies overview, the Anderson acquisition thesis) now lives in a Notion
  "Jack Reference" page tree, and SOUL.md tells Jack to find it by title rather
  than a stored id since Taylor may move it, to read it on demand, and to WRITE
  durable learnings back with NOTION_ADD_PAGE_CONTENT. MEMORY.md remains the
  short hot cache under the 2,200 char injection cap. The obsidian-vault MCP is
  disabled: 14 tool schemas on every call pointed at a directory nobody writes
  to, and the built-in file toolset already covers local access, so no
  capability is lost. SOUL.md also now states that Notion is Taylor's real
  working system (daily notes, task databases, M&A Pipeline, Producer Pipeline,
  TK Holdings Deal Pipeline, per-company command centres) and should be treated
  as a primary source, not just Jack's filing cabinet.
  v1.1.18 fills the identity from Taylor's second brief: the people who matter
  by name across Outlaw, Anderson and Gibson, the Anderson acquisition thesis,
  his personal rhythm (America/Denver, 6-7pm family protected, mornings for
  focused work and not to be filled because they look free), and a memory
  discipline. That last one matters because MEMORY.md is injected on every call
  and TRUNCATED at 2,200 characters, so a growing relationship database written
  there would silently stop being true. SOUL.md now splits it: MEMORY.md is the
  hot cache, the Obsidian vault is the record read on demand, and inferences are
  marked as such so a possibility never hardens into a fact. Aaron Phillips is
  the live example, several future structures are possible and none is decided.
  Voice is honest about its own gap: the rules are directional, no real sent
  mail has been used, and drafts are first passes until it has.
  v1.1.17 fixes an instruction that broke the first identity test. v1.1.14 told
  Jack to address a Google identity by passing the email in the `account` field.
  That works on googlecalendar and FAILS on gmail with 'No account found matching
  "taylor@tk-holdings.com"'. Asked for a morning brief, Jack hit the gmail
  failure and reported that none of the three accounts were connected, while the
  session was valid with all ten bound. The `account` field wants the alias or
  the connected account ID, and `ca_...` is the form that works on every toolkit
  (verified side by side: email -> isError, ca_id -> the right mailbox, omitted
  -> silently the personal one). New `jack composio accounts` maps every ca_ id
  to the human identity behind it, resolved live because those ids change on
  reconnect, and SOUL.md now tells Jack to read the mapping there, to use ids
  rather than addresses, and that 'No account found matching' means wrong
  identifier and NOT a broken integration to escalate.
  v1.1.16 builds Jack's identity from Taylor's own brief: four companies (TK
  Holdings, Outlaw Industrial, Anderson Tax & Consulting, Gibson) with his role
  in each, his people in priority order with family above all business, his
  voice, his nine standing priorities as an explicit tiebreaker, and the
  escalation rule for what earns an interruption. The stock Hermes persona was
  REPLACED, not appended to. It opened "You are Hermes Agent, created by Nous
  Research" and its response contract instructed the agent to "lead with the
  strongest counterargument" and be "provocative, aggressive, argumentative" -
  the opposite of the friendly, collaborative, optimistic voice Taylor asked
  for, and it would have bled into every email drafted on his behalf. The parts
  worth keeping (never fabricate, verify before finalizing, label uncertainty,
  no sycophancy, do not cave without new evidence) were kept and rewritten in
  his register. SOUL.md is now entirely em-dash free, because that is his one
  absolute style rule and a document that breaks its own rule teaches the wrong
  thing. platform.yaml gains his real companies; the *_OS rows move to
  company_builds, which is what they always were.
  v1.1.15 prunes the always-on skill index. 105 installed skills cost 8,803 B
  (~2,200 tokens) of system prompt on EVERY call to EVERY model, before Jack
  reads any of them. Two of the pruned entries are correctness rather than cost:
  SOUL.md forbids reaching Google through anything but Composio — no
  google-workspace CLI, no himalaya — yet both skills sat in the index telling
  Jack how to do exactly that. `hermes skills opt-out --remove` is all-or-nothing
  over BUNDLED skills and would have deleted the useful ones (notion, docx, pdf,
  xlsx, obsidian, github, claude-code) while keeping this repo's setup-only 23,
  so the prune is declared in platform.yaml skills.prune and applied by
  skills_prune.py, which also sets the .no-bundled-skills marker so `hermes
  update` cannot re-inflate it. Bootstrap runs it after the skills sync, names
  are validated against path traversal, unlisted skills are never touched, and
  `sudo hermes skills opt-in --sync` restores everything.
  v1.1.14 tells Jack HOW to reach each identity, not just that he should. All
  ten accounts are connected and bound (gmail x3, googlecalendar x3, googledrive
  x3, notion x1), and the router does expose selection — COMPOSIO_MULTI_EXECUTE_
  TOOL takes an `account` field that accepts the address directly. But omitting
  it does not search everything: it silently uses one default account. Verified
  with all three calendars connected — no `account` returned only the Outlaw
  calendar; account="taylor@tk-holdings.com" and account="taylorcovey15@gmail.com"
  each returned exactly their own. SOUL.md now names the three addresses, shows
  the call shape, and says an unscoped question means one call per account with
  results labelled. A confident answer drawn from one inbox out of three is worse
  than no answer.
  v1.1.13 makes several accounts per toolkit actually usable, and stops the
  connect flow depending on an operator. Binding many accounts was not enough:
  with two Google Calendars ACTIVE, a tool call still resolved to ONE of them —
  LIST_CALENDARS returned the personal account's 2 calendars and none of the 5
  on the work account, which is the quiet-wrong-answer failure ("nothing on
  today" while the work calendar is full). sessions.create now sets
  multi_account (enable, max 10 per toolkit), and SOUL.md tells Jack that an
  unscoped question means every identity. Separately, Composio caps a connect
  link at 15 minutes and one link connects one account, so three Google
  identities across gmail/calendar/drive is nine links on nine clocks; that
  window was missed twice while minting them by hand. `jack composio connect
  [toolkit] [--count N]` mints them locally, always with allow_multiple so a
  link adds rather than replaces, and SOUL.md tells Jack to mint them himself
  when Taylor asks. The link_token is dropped before printing.
  v1.1.12 makes the cheap tier reachable and cuts the per-call prefix again.
  MCP tool schemas turned out to be the larger half of the cost: of the 106
  tools Jack loaded, 81 came from three servers he must not or does not use —
  agentmail (25, which SOUL.md forbids him from touching), agentphone (28, a
  bridge with no key) and orgo (28, remote-VM lifecycle for an assistant that
  runs on the box). Those plus x-docs now ship disabled, removing no capability
  Jack was permitted to use. Routing gets two real axes, because Hermes has no
  per-message model hook: cron.model pins scheduled work to Haiku (that is where
  unattended spend lives and the work is mechanical), and SOUL.md makes Jack
  route interactively by DELEGATING mechanical sub-tasks to a Haiku sub-agent
  via delegation.model — the router is the model itself, with the whole question
  in view, at no extra call. (The first attempt used a per-call model override on
  delegate_task; a live test proved that parameter is internal and never reaches
  the tool schema, so the sub-agent silently inherited Sonnet.) Making Haiku the gateway default
  is documented as a supported one-line flip but is not the default, because it
  puts the weaker model in charge of spotting a hard question and it fails
  silently rather than escalating.
  v1.1.11 is the cost-and-capacity pass, driven by measurement rather than
  guesswork. Jack's cached prefix is ~33,555 tokens, and agent.log showed every
  turn's FIRST call arriving with no cache hit while calls 2..N inside the same
  turn hit 82-100% — a 5-minute cache TTL expiring between messages. cache_ttl
  is now 1h, the other tier Anthropic offers. `hermes prompt-size` then showed
  tool schemas (62.3 KB / 36 tools) dwarfing the system prompt (22.7 KB), so the
  telegram toolset list drops nine toolsets that were ALREADY failing their own
  runtime checks every turn — browser, computer_use, image_gen (bfl, the single
  largest at 10.2 KB), kanban, web, tts, spotify, x_search, orgo_desktop. Their
  schemas were billed on every call to every model and were never callable. cli
  keeps the full set: this narrows the phone, not the machine. An empty fallback
  chain meant an Anthropic 529 simply failed at Taylor; OpenRouter now backs the
  primary (Sonnet, then Gemini as an independent path). Composio now binds EVERY
  active account per toolkit rather than only the newest, so several Google
  identities work at once. And local inference is diagnosed honestly: it fails
  here because of 92% CPU steal, not because Ollama is broken, so the doctor
  measures steal on any local failure and names the host instead of the daemon.
  v1.1.10 makes Jack's Composio tools actually reach a connected account. A
  tool-router session does NOT inherit the project's connected accounts from a
  shared user_id — binding is explicit, via sessions.create(connected_accounts=
  {slug: ca_id}). Without it the router answered every call with "No active
  connection found for toolkit(s) 'googlecalendar' in this session" while
  client.tools.execute(user_id='taylor') on that same ACTIVE connection
  succeeded. That contradiction read like a broken OAuth; the OAuth was fine,
  the session was simply never told which account to use. composio_session now
  resolves this user's ACTIVE connections at init and binds them, and folds them
  into scope_key so connecting or reconnecting an account re-mints the session
  on the next gateway start — binding happens at CREATE and a resumed session
  can never pick up a new connection. Ids are resolved live, never declared,
  because ca_ ids change on every reconnect. `jack composio status` now
  distinguishes scoped from bound: a scoped toolkit with no bound account is a
  warning, not a tick, which is what let a green status sit next to a Calendar
  that could not be read.
  v1.1.9 verifies v1.1.8 against the real vault and quiets six MCP servers that
  had no usable credential. `jack secrets status` now resolves all five declared
  runtime secrets live (four from 1Password, TELEGRAM_BOT_TOKEN from .env), the
  restarted gateway process genuinely carries ANTHROPIC_API_KEY in its own
  environment, and `jack doctor --providers` reports live Anthropic, OpenRouter
  and Gemini inference — the "No Anthropic credentials found" failure is gone,
  confirmed by a real agent turn on provider=anthropic delivered to Telegram.
  Separately, agent-cards, linear, xapi-app-only, vidiq, ideabrowser and
  latitude were connecting on EVERY turn and failing (two on non-interactive
  OAuth, three on 401, one on an unset key interpolated into its url), adding
  handshake latency to the front of each turn and burying real errors under WARN
  noise. All six now ship `enabled: false`, following the precedent xapi already
  set. Their urls, headers and ${VAR} references are untouched, so re-enabling
  is one boolean once the matching key reaches the vault. No credential is
  removed and no configuration is lost.
  v1.1.9 also stops `jack doctor` lying about providers. gateway-run.sh sources
  the rendered runtime env, but `jack` and route.key_available did not, so they
  inspected a shell with no credentials and reported "provider anthropic
  unavailable (credential: 1Password map (disabled))" about a provider the
  running gateway was authenticating with. That is the v1.1.8 bug in another
  place — a credential that exists but never reaches the process that needs it —
  so both now read the same 0600 file the gateway reads (presence only,
  read-only; rendering stays the gateway's job). Finally, the derived paths a
  deploy creates inside the checkout (backups/, stage/, composio-venv/,
  platform-manifest.json) are gitignored, so "deployed from a working tree with
  uncommitted changes" now means something.
  v1.1.8 unifies the runtime secret path and fixes "Primary provider auth
  failed: No Anthropic credentials found." The gateway wrapper sourced only
  /root/.env and ~/.hermes/.env, while config.yaml keeps
  secrets.onepassword.enabled false on purpose (enabling it makes Hermes
  resolve all 21 op:// references at startup — sequential `op read`, /dev/tty
  prompts, cold-start stalls, MCP timeouts). A key living ONLY in the vault
  therefore never reached the gateway process. COMPOSIO_API_KEY was the sole
  exception because v1.1.2 gave it, and only it, a derived runtime env file.
  That fix is now generalised: platform.yaml declares which secrets the runtime
  needs, lib.resolve_runtime_secret is the single resolver every component uses,
  and nicks-stack-secrets renders them into one 0600 root-owned
  runtime/secrets.env that gateway-run.sh sources before exec. Rendering is
  atomic and fail-closed — a missing required secret removes the file rather
  than leaving a partial one. The Composio key is no longer stored twice:
  mcp.env carries only the URL and transport, and activation refuses unless the
  key is genuinely present in the rendered file, so the x-api-key header still
  cannot expand to empty. Hermes' plaintext op_cache.json value caches are
  purged on every render. New: `jack secrets status` (presence only, never
  values) and verify.sh section 8a.
  v1.1.7 stops one unprovisioned capability from taking the whole Composio
  session down. googlecontacts has no Composio-MANAGED OAuth app, so naming it
  in sessions.create returned 400 "requires auth configs but none exist and
  cannot be auto-created" — and that 400 blocked Gmail, Calendar, Drive and
  Notion too, all four of which ARE managed. platform.yaml now carries
  composio.auth_configs: an empty id DEFERS that toolkit (it is omitted from the
  session and reported as pending), a real id is passed through to
  sessions.create(auth_configs={slug: id}). Google Contacts is deferred for MVP.
  Strict scoping is unchanged: an unRESOLVED toolkit still fails the whole init
  and an empty toolkit list still refuses to create an unscoped session — only a
  declared narrowing is allowed through. session.json records a scope_key, so
  filling in the auth config id later re-mints the session instead of silently
  resuming the narrower one.
  v1.1.6 fixes the launcher's import ORDER. _sdk() appended the venv's
  site-packages, putting it behind Ubuntu's /usr/lib/python3/dist-packages, so a
  system copy of a shared dependency won: composio failed with "cannot import
  name 'Sentinel' from 'typing_extensions'". The paths are now prepended, which
  is what reproduces a real venv's resolution order (dist-packages is not on a
  venv's sys.path at all). New `nicks-stack-composio-session deps` proves each
  critical dependency resolves from the venv, and bootstrap and verify.sh both
  gate on it.
  v1.1.5 made bootstrap verify the EXACT runtime path instead of a
  reimplementation of it: it runs the launcher and reads its own sdk_importable
  verdict. It also stops suppressing the reason, and repairs the real cause of
  the reported contradiction — a venv built by a different interpreter than the
  one that runs the launcher. composio's compiled extensions (pydantic_core,
  jiter, charset_normalizer) are ABI-locked to one CPython minor version, so
  <venv>/bin/python can import composio while system python3 + sys.path.append
  cannot. The verification was correct; the venv was wrong. Bootstrap now
  detects the mismatch and rebuilds.
  v1.1.4 moved the Composio SDK installation out of the reporting phase and
  into the install phase. It had been placed after `step 16 Summary` and after
  the exit-1 health-failure gate, so any run with a failing health check exited
  before reaching it — the launcher symlink (step 12) was already installed,
  which is why the launcher worked while the SDK was never installed and no pip
  error appeared anywhere. The acceptance test is now
  `<venv>/bin/python -c "import composio"`, asserted at install time, as a
  health check, and in verify.sh; bootstrap dies if it fails. A venv without pip
  is rebuilt rather than pip-installed into.
  v1.1.3 fixed the packaging of the Composio launcher: it was installed as a
  COPY into /usr/local/bin, where its `import lib` could not resolve, so it died
  with ModuleNotFoundError before any Composio code ran. It is now a symlink
  into the scripts tree, matching nicks-stack-route and nicks-stack-provider-doctor.
  bootstrap also installs python3-venv/python3-pip, surfaces the real venv/pip
  error instead of discarding it, verifies the SDK imports under the SYSTEM
  python (the interpreter that actually runs the launcher), and ABORTS when
  Composio is required by platform.yaml but cannot be installed. --skip-composio
  opts out. The behavioural invariant is that the launcher executes, not how it
  is installed.
  v1.1.2 fixed a credential-propagation inconsistency: the session manager could
  resolve COMPOSIO_API_KEY through `op read` while the Hermes gateway, which
  expands ${COMPOSIO_API_KEY} from its own environment, could not — producing a
  valid MCP URL with an empty x-api-key header and a silent 401. The resolved
  key is now written into the derived 0600 runtime env the gateway already
  sources, one canonical resolver serves session init, activation, status and
  verify.sh, and activation refuses without a usable key. Composio no longer
  requires Hermes-wide 1Password resolution.
  v1.1.1 hardened the Composio Sessions integration: every failure path tears the
  runtime down (mcp.env removed AND the config entry spliced out), so a stale
  endpoint cannot survive and an empty url cannot exist; strict toolkit scoping
  is the default so a resolution failure can never create an unscoped session;
  session.json carries diagnostic metadata; `jack composio status` reports live
  state; verify.sh checks stale runtime, missing key, empty url, invalid session
  and scope mismatch. Architecture unchanged.
  v1.1.0 migrated Composio from the legacy static MCP endpoint to the Sessions
  API. One durable session for Jack (user_id taylor) is resumed on every gateway
  start; session.mcp.url is re-fetched each time and rendered into a derived
  runtime env file, and the header is x-api-key carrying COMPOSIO_API_KEY.
  connect.composio.dev, x-consumer-api-key and COMPOSIO_CONSUMER_KEY are gone.
  v1.0.6 was a capability migration, not a platform change. Jack's Google
  surfaces (Gmail, Calendar, Drive, Contacts) and Notion are declared
  Composio-backed; Hermes-native Google integrations are forbidden and
  verify.sh fails if one appears. AgentMail stays installed but is reserved for
  the autonomous business agents and is off by default for Jack. The decision
  lives in platform.yaml (capabilities), is carried into the agent prompt by
  SOUL.md, and is enforced by verify.sh section 8b.
  v1.0.5 removes the last place the platform started Hermes to read
  configuration. On this Hermes a `config get` is not a cheap file read: the
  CLI completes its full startup (resolve every op:// reference, load plugins,
  connect MCP servers, start adapters) before printing the value. v1.0.4's
  layout detection ran one per candidate, so a configuration read booted the
  default runtime — 21 secret resolutions and MCP OAuth against Composio,
  Agent Cards, Linear, X, Vidiq and Latitude. That is upstream CLI behaviour
  and is not worked around; the platform simply stops asking Hermes questions
  a YAML file already answers. Two supporting fixes: hermes children now run in
  their own process group and are reaped as a group (killing `hermes` used to
  orphan its MCP servers, which kept authenticating after the doctor exited),
  and the 120s cold-start ceiling no longer applies to the capped HTTP
  validation path.
  v1.0.4 fixed two validation bugs. (1) The v1.0.3 profile did not isolate:
  HERMES_HOME and HERMES_PROFILE were set together, so Hermes looked for
  profiles/validation/profiles/validation/, found nothing and fell back to the
  default config with all 21 op:// references. The selection layout is now
  MEASURED — Hermes is asked which secret map it sees — and only a layout that
  demonstrably isolates is used. (2) Provider validation asked for the model's
  full completion budget, which OpenRouter answers with HTTP 402 because it
  prices a request by its maximum possible cost; every validation probe is now
  capped at validation.max_tokens (default 16) and the uncappable Hermes leg is
  opt-in. Normal routing is unchanged.
  v1.0.3 added runtime profiles. A one-shot validation call no longer starts the
  gateway's full runtime: `validation` is a derived config tree (generated from
  config.yaml, never hand-written) with no MCP servers, no browser tooling, no
  long-lived integrations and only the provider credentials inference needs.
  It is the SAME hermes startup pointed at a smaller config tree — HERMES_HOME
  under ~/.hermes/profiles/, Hermes' own documented profile layout. The gateway
  and any user-driven run keep the full runtime. A profile can make validation
  faster; if it is unusable the call falls back to the full runtime and says so.
  v1.0.2 fixed one runtime discrepancy and nothing else: every tool that
  spawned `hermes chat` did so with a bare environment and none of the
  gateway's launch flags, so it exercised a different runtime than production
  and hung. All hermes children now get the gateway's own initialisation
  (bridged .env files, 1Password token, --accept-hooks, bounded --max-turns,
  stdin closed) via one shared helper. Routing and providers are unchanged.
  v1.0.1 fixed only the implementation bugs found during real validation on the
  Orgo VM: git/repo discovery, Ollama takeover, provider-doctor timeouts,
  optional native Gemini, dynamic Anthropic model resolution and failure
  diagnostics. No architecture changed.
  Deployment platform for Hermes-based company agents: bootstrap, update and
  verify tooling, an explicit provider-routing layer (Anthropic, OpenRouter,
  Gemini, Ollama), supervised services, and a 1Password secret plane. Frozen at
  v1.0.0 — from here the work is agent identity and company builds, not
  infrastructure.

# Component versions. These are what `jack doctor` reports under Versions.
versions:
  platform: 1.1.23
  bootstrap: 1.1.23
  update: 1.1.23
  verify: 1.1.23
  routing: 1.0.8
  doctor: 1.0.7
  manifest: 1.0.2

# Services this platform supervises. Supervisor is the init for services on
# this platform — not systemd. `optional` services may be absent on a machine
# without that being a failure.
services:
  - name: hermes-gateway
    optional: false
    wrapper: /usr/local/bin/hermes-gateway-run.sh
    description: Hermes agent gateway — Telegram, MCP connections, plugins, cron.
  - name: agentphone-bridge
    optional: true
    wrapper: /usr/local/bin/nicks-stack-agentphone-bridge-run.sh
    description: AgentPhone webhook bridge. Dormant until AgentPhone is keyed.
  - name: ollama
    optional: true
    wrapper: /usr/local/bin/nicks-stack-ollama-run.sh
    description: Local AI server. Only configured when local AI is enabled.

# The agent this platform hosts. Identity content (SOUL.md, persona, voice) is
# NOT part of the platform — it is the next sprint. This block only records who
# the platform is being built for so the doctor can report it.
identity:
  name: Jack
  role: Executive AI for Taylor
  status: built
  principal: Taylor Covey
  note: >-
    Built in v1.1.16 from Taylor's own brief. SOUL.md carries his four companies,
    his people and their priority order, his voice, his standing priorities, and
    the escalation rule. The stock Hermes persona is GONE rather than appended
    to: it opened "You are Hermes Agent, created by Nous Research" and its
    response contract told the agent to "lead with the strongest counterargument"
    and be "provocative, aggressive, argumentative", which is the opposite of the
    friendly, collaborative, optimistic voice Taylor asked for and would have
    bled into every email drafted on his behalf. The parts worth keeping (never
    fabricate, verify before finalizing, label uncertainty, do not be
    sycophantic, do not cave without new evidence) were kept and rewritten in his
    register. The whole file is em-dash free, because his one absolute style rule
    is never to use one and a document that breaks its own rule teaches the wrong
    thing.
  operating_principle: >-
    Protect Taylor's attention. The goal is not to show him everything, it is to
    make sure he never misses what matters and to handle the rest without asking.

# ==========================================================================
# Capability routing — ARCHITECTURAL DECISION (2026-08-03)
# ==========================================================================
# Jack NEVER uses Hermes-native Google integrations. Every Google surface and
# Notion goes through Composio. AgentMail stays installed for the future
# autonomous business agents and is off-limits to Jack unless he is explicitly
# told to use it in that conversation.
#
# This block is the enforceable statement of that decision: `jack doctor` reads
# it, platform/verify.sh fails if a forbidden implementation appears on the
# machine, and SOUL.md carries the same rule into Jack's prompt.
#
# TOOL IDENTIFIERS: only slugs actually confirmed in this repository are named
# here (`gmail`, `agent_mail`, the GMAIL_* / AGENT_MAIL_* tools). For the
# others the toolkit is resolved at run time with COMPOSIO_SEARCH_TOOLS rather
# than hardcoding a slug this repo has never verified.
capabilities:
  gmail:
    implementation: composio-session  # Sessions API, slug resolved at run time
    toolkit_search: gmail
    tools: [GMAIL_LIST_THREADS, GMAIL_FETCH_EMAILS, GMAIL_FETCH_MESSAGE_BY_THREAD_ID]
    forbidden: [hermes-native-google, google-workspace, gws, himalaya]
  google_calendar:
    implementation: composio-session
    toolkit_search: googlecalendar
    discovery: client.toolkits.list(search=...) at session creation  # slug not verified in this repo — resolve live
    forbidden: [hermes-native-google, google-workspace, gws]
  google_drive:
    implementation: composio-session
    toolkit_search: googledrive
    discovery: client.toolkits.list(search=...) at session creation
    forbidden: [hermes-native-google, google-workspace, gws]
  google_contacts:
    implementation: composio-session
    toolkit_search: googlecontacts
    # Composio has no managed OAuth app for this toolkit. Until an auth config
    # id is set in composio.auth_configs.googlecontacts it is omitted from the
    # session — the other four still work.
    status: pending-auth-config
    discovery: client.toolkits.list(search=...) at session creation
    forbidden: [hermes-native-google, google-workspace, gws]
  notion:
    implementation: composio-session
    toolkit_search: notion
    discovery: client.toolkits.list(search=...) at session creation
    forbidden: [hermes-native-notion]
  agentmail:
    implementation: agentmail-mcp     # mcp_servers.agentmail — installed, kept
    status: reserved
    jack_policy: do-not-use-unless-explicitly-instructed
    reserved_for: [Outlaw OS, Anderson OS, Signl OS]

# ==========================================================================
# Runtime secrets (v1.1.8) — the ONE declaration of what the gateway needs
# ==========================================================================
# The gateway process does NOT resolve op:// references itself: config.yaml
# keeps secrets.onepassword.enabled false on purpose, because turning it on
# makes Hermes resolve all 21 references at startup — sequential `op read`
# calls, /dev/tty prompts, cold-start stalls and MCP timeouts.
#
# That left a hole. gateway-run.sh sourced only /root/.env and ~/.hermes/.env,
# so a key that lived ONLY in 1Password never reached the gateway at all:
#
#     Primary provider auth failed: No Anthropic credentials found.
#
# COMPOSIO_API_KEY did not have this problem, because v1.1.2 gave it — and
# only it — a derived runtime env file. This block generalises that fix to
# every secret the runtime actually needs, and nothing else.
#
# The op:// REFERENCE still comes from config.yaml secrets.onepassword.env, so
# there is exactly one place references are declared. This block declares only
# WHICH of them the runtime resolves, whether it is required, and who consumes
# it. `required: true` means a failure to resolve is a hard failure.
# ==========================================================================
# Skill pruning  (v1.1.15)
# ==========================================================================
# Every installed skill contributes ~65-90 bytes to an always-on index that is
# billed on EVERY call to EVERY model. Measured with `hermes prompt-size`: 105
# skills = 8,803 B (~2,200 tokens) of the system prompt, before Jack has read a
# single one of them.
#
# Most of those are Hermes' BUNDLED skills, not this repo's 23. `hermes skills
# opt-out --remove` is all-or-nothing and would delete the useful ones while
# keeping this repo's setup-only set, so the prune is declared here instead:
# names below are removed, the marker stops them being re-seeded by `hermes
# update`, and everything unlisted stays.
#
# Two of these are CORRECTNESS, not cost. SOUL.md forbids reaching Google
# through anything but Composio — "Do not install, enable, configure or invoke
# a Hermes-native Google integration, a google-workspace / gws CLI, or
# himalaya" — yet both skills sat in the index telling Jack how to do exactly
# that. A skill that contradicts the architecture is worse than a wasted token.
#
# Fully reversible: `sudo hermes skills opt-in --sync` restores the lot.
skills:
  prune_bundled: true                 # set the .no-bundled-skills marker
  prune:
    # Contradicts SOUL.md capability routing — Google MUST go through Composio.
    - email/himalaya
    - productivity/google-workspace
    # Integrations this platform has disabled (v1.1.9 / v1.1.12).
    - email/agentmail-setup
    - productivity/agentphone-setup
    - social-media/xurl
    - social-media/x-mcp-integration
    # Not this agent's job: Jack runs calendar, mail, docs and deal work.
    - creative/architecture-diagram
    - creative/ascii-art
    - creative/ascii-video
    - creative/baoyu-infographic
    - creative/claude-design
    - creative/comfyui
    - creative/design-md
    - creative/excalidraw
    - creative/humanizer
    - creative/manim-video
    - creative/p5js
    - creative/popular-web-designs
    - creative/pretext
    - creative/sketch
    - creative/songwriting-and-ai-music
    - creative/touchdesigner-mcp
    - media/gif-search
    - media/songsee
    - media/youtube-content
    - mlops/evaluation
    - mlops/huggingface-hub
    - mlops/inference
    - mlops/models
    - smart-home/openhue
    # No Apple devices on this Linux VM — these can never run here.
    - apple/apple-notes
    - apple/apple-reminders
    - apple/findmy
    - apple/imessage
    # Research long tail. grounded-research and vendor-tool-evaluation stay.
    - research/arxiv
    - research/blogwatcher
    - research/llm-wiki
    - research/polymarket
    - research/research-paper-writing

runtime_secrets:
  dir: /root/.hermes/runtime          # derived tree; 0700, never committed
  file: secrets.env                   # 0600, rebuilt on every gateway start
  keys:
    - env: ANTHROPIC_API_KEY
      required: true
      consumer: hermes-gateway (primary model provider)
    - env: OPENROUTER_API_KEY
      required: true
      consumer: hermes-gateway (declared fallback provider)
    - env: GEMINI_API_KEY
      required: false
      consumer: hermes-gateway (optional provider)
    - env: COMPOSIO_API_KEY
      required: true
      consumer: composio session manager + gateway x-api-key header
    - env: TELEGRAM_BOT_TOKEN
      required: true
      consumer: hermes-gateway (Telegram transport)
    - env: TK_FAMILY_TOKEN
      required: false
      consumer: tk-family MCP server (x-mcp-token) + tkfamily_scan.py

  # Hermes writes resolved op:// values to a PLAINTEXT json cache when it does
  # its own resolution. The platform never enables that, but a stale file can
  # survive from an earlier run — it is Hermes-owned, regenerated on demand,
  # and must not persist provider credentials in plaintext json. Purged on
  # every render.
  purge_plaintext_caches:
    - /root/.hermes/cache/op_cache.json
    - /root/.hermes/profiles/validation/cache/op_cache.json

# Composio Sessions (v1.1.0). One durable session for Jack, resumed on every
# gateway start rather than re-created. The SEARCH TERMS below are resolved to
# real toolkit slugs at run time by client.toolkits.list(search=...) — no slug
# is hardcoded here, so a Composio rename surfaces as a loud "unresolved"
# rather than a silently wrong slug.
composio:
  user_id: taylor
  sdk_path: /opt/nicks-stack/composio-venv/lib
  toolkits:
    gmail: gmail
    google_calendar: googlecalendar
    google_drive: googledrive
    google_contacts: googlecontacts
    notion: notion

  # Toolkits with NO Composio-managed OAuth app. Composio cannot auto-create an
  # auth config for these, so naming one in a session returns:
  #   400 "The following toolkits require auth configs but none exist and
  #        cannot be auto-created: <slug>"
  # Confirmed against Composio's managed-auth list: gmail, googlecalendar,
  # googledrive and notion are managed; GOOGLECONTACTS is under "Requires Your
  # Own Credentials".
  #
  # Leave the value EMPTY to omit that toolkit from the session (the session
  # still creates, and the capability is reported as pending). Put an auth
  # config id here — created at platform.composio.dev with your own Google
  # OAuth client — and it is passed to sessions.create(auth_configs=...) and
  # included in the session.
  auth_configs:
    googlecontacts: ""

# TK Family document processing (v1.1.23).
#
# The Covey family captures documents in the TK Family app and drops scans in
# Google Drive. Jack reads each one, renames it, files it, and PROPOSES the
# task/bill/event rather than creating it. The family approves in the app.
#
# Two systems are involved and they are not interchangeable:
#
#   TK Family MCP   the document queue, the bill list, the task list, and the
#                   write-back calls (record_document_reading,
#                   mark_document_filed). Reached over plain JSON-RPC with an
#                   x-mcp-token header.
#   Composio Drive  the actual file work: list a folder, rename a file, move it
#                   between folders. TK Family's own organize_drive_file matches
#                   folders by NAME SUBSTRING, and "Bills and Receipts" occurs
#                   fifteen times in this tree, so it must not be used here.
