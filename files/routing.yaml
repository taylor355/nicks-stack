# ==========================================================================
# Nick's Stack — provider routing map  (deployed to /root/.hermes/routing.yaml)
# ==========================================================================
# The single inspectable source of truth for "which mode uses which model".
# Nothing here is inferred at runtime: `nicks-stack-route show` reads this file
# and reports the mode, provider, model and reason verbatim. There is no
# automatic or opaque routing in v1 — a mode changes only when someone asks
# for it.
#
# MECHANISM (verified against this repo, not assumed)
#   Per-call routing uses the Hermes CLI flags that the AgentPhone bridge
#   already uses in production:
#       hermes chat -Q --source <src> -m <model> --provider <provider> -q <prompt>
#   (files/agentphone-bridge/agentphone_bridge.py:1270-1276, and
#    skills/productivity/agentphone-setup/references/inbound-webhook-bridge.md:144
#    — which also records that HERMES_INFERENCE_MODEL does NOT work for
#    `hermes chat`, only for `hermes -z` and `--tui`. Use the flags.)
#
#   `smart` is the gateway's own configured model, so it costs nothing extra:
#   Jack simply answers. Every other model-backed mode is a one-shot
#   subprocess, which is why switching modes needs no gateway restart and
#   cannot disturb Telegram, sessions or memory.
#
# PROVIDER NAMES are Hermes plugin names, confirmed enabled in
# files/config.yaml → plugins.enabled: anthropic-provider, openrouter-provider,
# xai-provider, openai-codex-provider. Providers declared in the `providers:`
# block of config.yaml are addressed as `custom:<name>` instead.
#
# MODEL IDS below are Anthropic API model IDs, used by provider `anthropic`
# against https://api.anthropic.com (files/config.yaml → model.base_url).
# Verify them on the machine before trusting them:
#   nicks-stack-route probe --mode fast
# ==========================================================================
version: 1

# --------------------------------------------------------------------------
# How a model actually gets chosen  (v1.1.12)
# --------------------------------------------------------------------------
# The modes below are the MANUAL axis — someone names a mode. That was the whole
# story until v1.1.12, which is why `fast` existed and nothing ever reached it:
# every Telegram message ran on the gateway default and the cheap tier was
# unreachable in practice.
#
# Hermes has no per-message model hook. Profile routing keys on platform and
# chat_id (a Discord feature), not on what was said, and there is no per-turn
# override. So automatic routing had to come from somewhere real, and there were
# exactly two supported places:
#
#   A. SCHEDULED WORK -> config.yaml `cron.model: claude-haiku-4-5`.
#      Unpinned cron jobs run on Haiku. This is where unattended spend lives and
#      the work is mechanical, so it is a straight 3x cut with no judgement lost.
#      A job that needs more overrides with `hermes cron create --model`.
#
#      B. INTERACTIVE -> DELEGATION. config.yaml `delegation.model:
#      claude-haiku-4-5` puts every sub-agent on the cheap tier, and SOUL.md
#      tells Jack when a sub-task is mechanical enough to hand down. The router
#      is the model itself, with the whole question in front of it, and it costs
#      no extra call — a separate classifier would be paid for on every message
#      and would decide with strictly less information.
#
#      Verified the hard way: the first version told Jack to pass a model
#      override to `delegate_task`. He ran the task and reported that the tool
#      exposes no such parameter — delegate_tool.py's model/provider arguments
#      are internal and never reach the tool schema — so the sub-agent quietly
#      inherited Sonnet and the "saving" was zero. `delegation.model` is the
#      supported control and needs no per-call argument.
#
# What was deliberately NOT done: making Haiku the gateway default and having it
# escalate. It is one line in config.yaml (`model.default`) and it works, but it
# puts the weaker model in charge of recognising a hard question — and when it
# fails it does not escalate, it just answers badly, silently.
#
# `deep` (Opus) stays manual and confirmation-gated on purpose; nothing
# escalates into it automatically.
# --------------------------------------------------------------------------

# The mode used when nobody has selected one. `smart` is the gateway default,
# so this matches model.default in config.yaml on purpose.
default_mode: smart

# Selected mode lives under state/, which platform/update.sh treats as
# preserved user data — a deployment never resets the chosen mode.
state_file: /root/.hermes/state/nicks-stack-mode.json

modes:

  fast:
    provider: anthropic
    tier: haiku                # resolved live from the Anthropic catalog
    model: claude-haiku-4-5    # offline fallback only — the tier wins
    key_env: ANTHROPIC_API_KEY
    execution: hermes-oneshot
    tools: true
    fallback: smart
    summary: Routine email, calendar, summaries, classification, formatting.
    why: >-
      Least expensive Anthropic model that still supports the tool-calling loop
      Hermes needs ($1/$5 per MTok vs $3/$15 for smart). Chosen for volume work
      where the answer is mechanical rather than judgemental.

  smart:
    provider: anthropic
    tier: sonnet               # resolved live from the Anthropic catalog
    model: claude-sonnet-5     # offline fallback only — the tier wins
    key_env: ANTHROPIC_API_KEY
    execution: gateway-default
    tools: true
    fallback: null
    summary: Default runtime. Business reasoning, Notion, Gmail, Calendar, Drive, CRM
      (all via Composio — see platform.yaml capabilities; never Hermes-native Google).
    why: >-
      Cost-conscious high quality, deliberately not the premium Opus tier. This
      is the model the gateway itself runs (config.yaml → model.default), so
      answering in this mode adds no subprocess and no extra latency.

  deep:
    provider: anthropic
    tier: opus                 # resolved live from the Anthropic catalog
    model: claude-opus-5       # offline fallback only — the tier wins
    key_env: ANTHROPIC_API_KEY
    execution: hermes-oneshot
    tools: true
    fallback: smart
    requires_confirmation: true
    summary: Executive strategy, acquisition analysis, complex insurance/tax/legal/financial reasoning.
    why: >-
      Premium tier, reserved for work where being wrong is expensive. Never
      selected automatically: `nicks-stack-route run deep` refuses without
      --confirm, and no cheaper mode may escalate into it.

  build:
    execution: specialist-cli
    host: mac-mini                 # see platform.yaml -> mac_bridge (v1.1.34)
    bridge: python3 /root/.hermes/scripts/platform/mac_bridge.py
    specialists:
      - name: claude-code
        binary: claude
        auth_check: mac_bridge.py status          # a live one-turn prompt, not a readout
        invoke: mac_bridge.py build '<task>' --confirm
        preferred: true
      - name: codex
        binary: codex
        auth_check: mac_bridge.py status
        invoke: mac_bridge.py build '<task>' --confirm --specialist codex
        preferred: false
    requires_approval: true
    fallback: null
    summary: Documents, PDFs, HTML, spreadsheets, scripts and repository changes.
    why: >-
      Claude Code and Codex are locally authenticated CLI execution
      environments, not API providers — a consumer subscription must never be
      driven through an API key. That is exactly why build work runs on
      Taylor's Mac mini, where the login lives: the flat-rate plan absorbs the
      tokens instead of the metered API, and no credential ever leaves his
      machine. Hermes stays the conductor, fetches the artifact back and
      delivers it on Telegram. Codex is the backup lane when the Claude plan
      limit is hit. See the mac-bridge and coding-agent-routing skills.
    # AUTH LIVES ON THE MAC, NOT HERE (v1.1.34).
    # Claude Code is installed on this VM but deliberately unused for `build`:
    # authenticating it here would mean minting a token for a consumer
    # subscription on a cloud VM, which is the thing the policy above forbids.
    # `claude` on this VM stays available for local one-off inspection only.

  local:
    execution: ollama
    provider: custom:ollama
    model: null                # resolved at run time from installed models
    key_env: null              # local daemon, no credential
    fallback: null
    # WHERE the daemon is. null means "this VM", which is the configuration
    # that has never worked (see the CPU note below). Set this to the Mac
    # mini's Tailscale name and the mode comes alive with no other change:
    #   host: mac-mini
    # platform.yaml -> mac_bridge is the single place that name is configured;
    # `python3 mac_bridge.py models` reports what the Mac can actually run.
    # LIVE as of v1.1.34, measured not assumed: qwen3:8b on Taylor's Mac mini
    # answered a real prompt through this address in 18.7s cold, 23 tok/s.
    #
    # 127.0.0.1 is not a typo. Ollama on the Mac listens on loopback only, and
    # that was left alone deliberately — a supervised ssh tunnel
    # (mac-ollama-tunnel) forwards this port to it, which is strictly more
    # private than binding the daemon to the network and needs nothing clicked
    # on the Mac. If the tunnel is down this fails to connect, which is the
    # correct behaviour: never silently reroute free work to a paid tier.
    host: 127.0.0.1
    port: 11435
    fallback_when_host_down: null
    summary: Local Ollama — private, free, no data leaves machines Taylor owns.
    why: >-
      Routes to an Ollama daemon. The model is whichever one is pulled there
      (discovered from /api/tags), so nothing is assumed. If the daemon is down
      or no model is pulled, this mode fails cleanly with "not
      installed/configured" and never falls back to a paid route.
    # BLOCKED ON HOST CPU, NOT ON CONFIGURATION (v1.1.11).
    #
    # This mode does not work on the current VM, and no setting here will fix
    # it. Measured from /proc/stat: 92% steal, 0.3% idle — the VM asks for CPU
    # essentially all the time and receives roughly 7% of one core. A trivial
    # Python loop that costs ~1s of CPU took 18.8s of wall clock.
    #
    # What that looked like before it was understood: `ollama ps` showed the
    # model RESIDENT, llama.cpp had allocated its KV cache and printed
    # "warming up the model with an empty run", and then the client timed out
    # and Ollama logged "client connection closed before llama-server finished
    # loading, aborting load" — so the load was abandoned and the next probe
    # started from cold again. Both a 4B and a 1.7B model failed identically;
    # the 1.7B did not finish a warmup in 20 minutes. Ollama is healthy, the
    # daemon answers, the models are pulled. There is simply no CPU.
    #
    # `nicks-stack-provider-doctor` now measures steal on any local inference
    # failure and says so, instead of reporting a bare "HTTP 0 timed out".
    #
    # THE FIX IS A DIFFERENT MACHINE, NOT A BIGGER VM (v1.1.34).
    # Taylor has an always-on Mac mini. Apple Silicon has real cores and a
    # unified-memory GPU, so a 7-8B model answers in seconds there. Point
    # `host` above at its Tailscale name and this mode works:
    #   on the Mac:  ollama pull qwen3:8b
    #                launchctl setenv OLLAMA_HOST 0.0.0.0   (bind beyond loopback)
    #   here:        routing.yaml -> modes.local.host: mac-mini
    #                python3 mac_bridge.py models   (must list a chat model)
    #
    # WHAT LOCAL IS AND IS NOT WORTH. It is free and private, and that is the
    # whole case for it. An 8B model is not close to Sonnet on the judgement
    # work Jack actually does, so `local` stays a MANUAL mode: good for bulk
    # classification, redaction, summarising something Taylor would rather not
    # send to a vendor, and for keeping working when an API is down. Nothing
    # escalates into it and nothing is automatically demoted to it.

# --------------------------------------------------------------------------
# Providers — what `nicks-stack-provider-doctor` validates end to end.
# Each entry is credential + catalog + one real inference. Model ids here are
# CANDIDATES: the doctor checks every one against the vendor's own live list
# and reports what it actually used, so a stale pin degrades to a clear
# message instead of a silent wrong route.
# --------------------------------------------------------------------------
providers:

  anthropic:
    display: Anthropic
    provider: anthropic          # plugins.enabled → anthropic-provider
    key_env: ANTHROPIC_API_KEY
    enabled: true
    # Tiers, not pins. The doctor queries GET /v1/models and resolves the
    # current id for each tier (cached 24h in state/anthropic-models.json).
    # `models` below is the offline fallback if the catalog is unreachable.
    tiers: [haiku, sonnet, opus]
    models:
      - claude-haiku-4-5
      - claude-sonnet-5
      - claude-opus-5

  openrouter:
    display: OpenRouter
    provider: openrouter         # plugins.enabled → openrouter, openrouter-provider
    key_env: OPENROUTER_API_KEY
    enabled: true
    # Verified present in https://openrouter.ai/api/v1/models on 2026-08-02.
    # The catalog is public, so the doctor re-verifies these on every run.
    models:
      - anthropic/claude-sonnet-5
      - google/gemini-3.6-flash
      - meta-llama/llama-3.3-70b-instruct

  gemini:
    display: Gemini
    # No Gemini plugin ships with this Hermes, so Gemini is registered as a
    # custom provider (config.yaml → providers.gemini) against Google's
    # OpenAI-compatible endpoint and addressed as custom:<name>, exactly like
    # providers.meta-model-api. Verified: POST /v1beta/openai/chat/completions
    # answers (400 on a bad key, not 404), and /v1beta/models lists the ids.
    provider: custom:gemini
    key_env: GEMINI_API_KEY
    enabled: true
    # Native Gemini is OPTIONAL: a failure here is reported separately and does
    # not fail platform validation, because google/gemini-* models remain
    # reachable through the OpenRouter provider.  (v1.0.1 bug 5)
    required: false
    fallback_provider: openrouter
    models:
      - gemini-3.6-flash
      - gemini-3.5-flash
    # If none of the candidates exist for this account, the doctor selects the
    # newest flash-class model the key can actually see and says so.

  ollama:
    display: Ollama
    provider: custom:ollama      # config.yaml → providers.ollama (local, key-less)
    host: http://127.0.0.1:11434
    enabled: true
    # Preference order. Whatever is listed here is only used if it is actually
    # pulled; otherwise the first chat-capable installed model wins. Embedding
    # models (nomic-embed-text and friends) are never selected for inference —
    # they cannot answer a prompt.
    models:
      - qwen3:4b

# ==========================================================================
# Runtime profiles  (v1.0.3)
# ==========================================================================
# A one-shot validation call needs a model, a credential and nothing else. The
# full runtime it was inheriting loads 12 MCP servers, 16 plugins, browser
# tooling, memory and the whole toolset surface before it can answer "ok" —
# and config.yaml declares MCP connect_timeouts up to 300s. That startup is
# what the gateway pays ONCE and keeps warm; a cold one-shot paid it every
# time (this is the v1.0.2 finding, now addressed at the source rather than
# with a longer timeout).
#
# MECHANISM (verified in this repo, not assumed)
#   Hermes' own layout for a named profile is ~/.hermes/profiles/<name>/, with
#   the default profile living directly in ~/.hermes/ — documented in
#   skills/autonomous-ai-agents/hermes-gateway-onboarding/SKILL.md:40-42.
#   HERMES_PROFILE is the profile-name variable
#   (local-packages/latitude-telemetry-hermes/.../config.py:86 reads
#   `HERMES_PROFILE or "default"`). HERMES_HOME is the config root and is
#   exported by files/gateway-run.sh, read by scripts/orgo_desktop/client.py
#   and set by platform/bootstrap.sh.
#
#   So a profile is NOT a new code path: it is the SAME `hermes` startup
#   pointed at a smaller config tree. Nothing here patches Hermes.
#
# The validation profile's config.yaml is DERIVED from the real one at build
# time — never hand-written — so it cannot drift. It is rebuilt automatically
# whenever the source config changes (a sha256 stamp is kept beside it).
#
# SAFETY: if the profile cannot be built, or a probe fails inside it for a
# startup/config reason, the caller retries once on the full runtime and says
# the profile was bypassed. A profile can make validation faster; it can never
# make it fail.
profiles:
  # How Hermes is told to use a profile. DECLARED, not measured (v1.0.5).
  #
  #   profile-var   HERMES_PROFILE=<name>, HERMES_HOME left alone
  #   hermes-home   HERMES_HOME=<profile dir>, no profile name
  #   home-root     HOME=<profile dir> + HERMES_HOME=<dir>/.hermes
  #
  # v1.0.4 discovered this by running `hermes config get` once per candidate.
  # That was removed: on this Hermes a `config get` is NOT a cheap file read —
  # the CLI completes its full startup (resolve every op:// reference, load
  # plugins, connect MCP servers, start adapters) before printing the value, so
  # a candidate that did not isolate booted the entire default runtime. The
  # value below is what that measurement reported on the real VM
  # (`jack profiles` -> "isolated via hermes-home"); it is now simply stated,
  # and nothing starts Hermes to re-derive it.
  #
  # Change this only if the installed Hermes changes how it selects a profile.
  selection: hermes-home

  # Which profile each kind of work runs in. Only unattended validation is
  # moved; anything a person asked for keeps the full runtime.
  use:
    validation: validation     # provider doctor, route probe, jack doctor --providers
    routing_run: gateway       # `nicks-stack-route run` — real work, real tools
    gateway: gateway           # the supervised service — never derived

  gateway:
    display: Full runtime
    kind: full
    # The machine's real ~/.hermes. Nothing is derived, copied or rewritten.
    description: >-
      Everything: MCP servers, plugins, browser tooling, memory, skills and the
      full toolset surface. This is what the supervised gateway and any
      user-driven run must keep.

  validation:
    display: Validation runtime
    kind: derived
    # Relative to HERMES_HOME, matching Hermes' documented profile layout.
    dir: profiles/validation
    description: >-
      The minimum that can perform inference: model, providers, provider
      credentials. No MCP servers, no browser tooling, no long-lived
      integrations, no memory writes.
    include:
      # Config blocks copied verbatim from the real config.yaml. Anything not
      # listed here simply does not exist in the derived config.
      blocks:
        - model                 # default model + provider + base_url
        - providers             # custom providers (gemini, ollama, …)
        - prompt_caching
        - approvals
        - _config_version
      # Provider plugins only. Computed from this file: every plugin whose
      # name ends in `-provider`, plus any plugin named exactly like a
      # provider this routing map addresses. Tool plugins are dropped.
      plugins: providers-only
      # No MCP server is carried over at all.
      mcp_servers: false
      # No toolsets — a validation probe calls no tools.
      toolsets: []
      # Only the credentials this routing map actually names, so a cold start
      # resolves ~4 op:// references instead of 21.
      secrets: routing-keys
      # Memory/session machinery off: a probe must not write user state.
      ephemeral: true
    # Files linked in from the real profile so credentials and identity
    # resolve normally. Linked, never copied — no secret is duplicated on disk.
    link:
      - .env
      - .op.env
      - auth.json
      - SOUL.md

# ==========================================================================
# Validation cost policy  (v1.0.4)
# ==========================================================================
# A credential check must be cheap. It was not: with `hermes` present, the
# doctor's inference step always went through `hermes chat`, and Hermes
# advertises the model's own maximum completion budget. OpenRouter prices a
# request by its MAXIMUM possible cost, so an uncapped probe asking for up to
# 128000 output tokens returns HTTP 402 (insufficient credits) on an account
# that could easily afford the four tokens the probe actually uses.
#
# MECHANISM (verified — and one deliberate non-mechanism)
#   The vendor APIs all take an explicit output cap, and that is the lever
#   used here: Anthropic `max_tokens`, OpenAI-compatible `max_tokens`,
#   Gemini `generationConfig.maxOutputTokens`, Ollama `options.num_predict`.
#
#   There is NO verified way to cap `hermes chat`'s advertised completion
#   budget: no --max-tokens flag is documented for `hermes chat` (the
#   documented flags are -Q, -q, -m/--model, --provider, --source, -t,
#   --max-turns, --accept-hooks, --tui), and
#   skills/productivity/secret-manager-setup/SKILL.md:130 records that
#   `providers.<name>.max_output_tokens` is NOT a recognised provider key.
#   Nothing is invented here to fill that gap.
#
# So validation defaults to the capped vendor call, and the Hermes runtime leg
# becomes opt-in. Both are still available:
#
#   nicks-stack-provider-doctor                 # api  — capped, cheap (default)
#   nicks-stack-provider-doctor --via hermes    # exercises the Hermes runtime
#   nicks-stack-provider-doctor --via both      # capped call, then the runtime
#
# This applies ONLY to validation/probe commands. `nicks-stack-route run` is
# real work and is never capped.
validation:
  # Smallest completion that can still carry the probe's answer.
  max_tokens: 16
  # api | hermes | both. `api` never spends more than max_tokens.
  inference: api
