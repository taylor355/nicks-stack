    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
# Prompt caching (v1.1.11). MEASURED, not guessed: Jack's cached prefix is
# ~33,555 tokens (system prompt + tool schemas), and agent.log showed every
# turn's FIRST API call arriving with no cache= line — a full-price 33.5k
# prefix — while calls 2..N within the same turn hit 82-100%. That is a 5-minute
# TTL expiring between messages: Taylor writes to Jack minutes-to-hours apart,
# so the cache was warm only *inside* a turn and cold at the start of every one.
#
# "1h" is the other tier Anthropic offers (hermes_cli/config_defaults.py:715 —
# only "5m" and "1h" are supported). The trade is the write multiplier: a 1h
# cache write costs 2x base vs 1.25x for 5m, while a read is 0.1x either way.
# So 1h loses only when consecutive messages are more than an hour apart, and
# wins whenever two land inside the same hour — which is what a working day with
# an assistant looks like.
prompt_caching:
  cache_ttl: 1h

# Scheduled work runs on the cheap tier  (v1.1.12 — routing axis A)
#
# Cron is where unattended spend accumulates: briefings, digests and watchers
# fire on a schedule whether or not anyone reads them, and the work is
# mechanical — fetch, filter, format. That is Haiku's job, not Sonnet's
# ($1/$5 per MTok vs $3/$15).
#
# `cron.model` is the supported global lever (cron/jobs.py:1165): unpinned jobs
# follow cron.model in preference to model.default, and Hermes deliberately does
# NOT engage its model-drift guard for the model axis when this is set, so cron
# spend stops shadowing interactive `/model` switches. A single job can still
# override with `hermes cron create --model ...` when it genuinely needs more.
#
# Interactive Telegram is untouched and still answers on model.default — see
# the routing note there.
cron:
  model: claude-haiku-4-5
  model_drift_guard: true

# Fallback chain (v1.1.11). Tried in order when the PRIMARY model fails with a
# rate-limit, overload or connection error — not for cost routing, which is what
# routing.yaml modes are for. Until now this was empty, so an Anthropic 529
# (their overload response, which does happen) ended the turn and Jack simply
# failed at Taylor.
#
# OpenRouter is the right shape for this slot: it is already a configured
# provider with a live key, it fronts the same Anthropic models, and it is a
# different vendor path — so an Anthropic-side incident does not take both out.
# Sonnet first (same tier as the primary, so quality is unchanged), then Gemini
# via OpenRouter as a genuinely independent backstop if Anthropic capacity is
# broadly unavailable.
#
# NOTE ON COST: this is deliberately NOT a cheaper-model chain. OpenRouter adds
# a margin over Anthropic direct and does not reproduce Anthropic's prompt
# caching, so a fallback turn costs more than a primary turn. That is the
# correct trade for an availability backstop that fires rarely.
fallback_providers:
  - provider: openrouter
    model: anthropic/claude-sonnet-5
    key_env: OPENROUTER_API_KEY
  - provider: openrouter
    model: google/gemini-3.6-flash
    key_env: OPENROUTER_API_KEY
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
stt:
