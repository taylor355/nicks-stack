# Implementations that must NOT appear on a Jack deployment. verify.sh checks
# for each of these; a hit is a critical failure, not an advisory.
forbidden_implementations:
  mcp_servers: [gmail, google, google-workspace, gws, googlecalendar, google-calendar,
                googledrive, google-drive, google-contacts, notion]
  # Legacy Composio wiring — must not come back.
  config_strings: ["connect.composio.dev", "x-consumer-api-key", "COMPOSIO_CONSUMER_KEY"]
  plugins: [google, google-workspace, gws, gmail, notion]
  binaries: [gws, google-workspace]

# Company builds that will inherit this platform. Declared, not provisioned —
# each becomes its own deployment using the same bootstrap/update/verify tools.
# Taylor's actual businesses, as he described them (v1.1.16). These are the
# entities Jack reasons about; the `*_OS` rows below are the future per-company
# agent builds that would inherit this platform, which is a different thing and
# was previously the only thing recorded here.
companies:
  - name: TK Holdings
    role: Holding and personal operating company
    taylor: Owner
    status: active
    note: >-
      Top-level entity. Owns the investments and businesses and coordinates
      everything else.
  - name: Outlaw Industrial
    role: Commercial industrial cleaning and field services
    taylor: Owner, strategy and growth
    status: active
    note: >-
      Long-term strategy, growth, acquisitions, systems, finance, leadership.
      NOT day-to-day operations. Jack works on operations, profitability,
      customer experience and scalability.
  - name: Anderson Tax & Consulting
    role: Accounting and tax, proactive planning and advisory
    taylor: Owner, growth and technology
    status: active
    note: >-
      Growth, technology, recruiting, AI, M&A. Jack prioritizes client
      experience, efficiency and scalable systems.
  - name: SIGNL Advisory
    role: New venture, early stage
    taylor: Co-founder with his brother Andrew Covey
    status: building
    note: >-
      Being tested rather than run. Smith Steelworks is the first prospect and
      the live test of the whole idea. Top priority while the venture is being
      proven: a first customer for a new venture outranks a larger number
      attached to an established business.
  - name: Gibson
    role: Commercial insurance
    taylor: Executive leadership
    status: active
    note: >-
      Growth initiatives, recruiting, acquisitions, strategic relationships,
      large client opportunities. Jack prepares meetings, surfaces
      opportunities, organizes follow-up and removes administrative work.

