# ---------------------------------------------------------------------------
# UNCONFIGURED MCP SERVERS SHIP DISABLED  (v1.1.9)
# ---------------------------------------------------------------------------
# Six servers below carry `enabled: false` for the same reason `xapi` already
# did: they have no usable credential on this platform, so every agent turn
# paid for them and got nothing back. Measured on a live cron turn:
#
#   agent-cards    OAuthNonInteractiveError — no cached tokens, and the gateway
#   linear         is headless, so the interactive `hermes mcp login` flow that
#                  would mint them can never run from here
#   xapi-app-only  401 Unauthorized — X_APP_ONLY_BEARER_TOKEN not in the vault
#   vidiq          401 Unauthorized — VIDIQ_MCP_API_KEY not in the vault
#   latitude       401 Unauthorized — LATITUDE_API_KEY not in the vault
#   ideabrowser    url interpolates ${IDEABROWSER_KEY}, which is unset, so the
#                  server is only ever contacted with an empty key
#
# Those six added ~2s of connect/handshake latency to the FRONT of every turn
# and a wall of WARN lines to agent.log and errors.log, which buried real
# failures. Disabling is the right lever rather than deleting: the url, the
# headers and the ${VAR} references are all still here, so the entire re-enable
# procedure is `enabled: true` once the matching key lands in the Hermes vault
# (plus `hermes mcp login <name>` for the two OAuth ones). No credential is
# removed and no configuration is lost.
# ---------------------------------------------------------------------------
mcp_servers:
  vidiq:
    url: https://mcp.vidiq.com/mcp
    headers:
      Authorization: Bearer ${VIDIQ_MCP_API_KEY}
    # disabled v1.1.9 — 401; set true when VIDIQ_MCP_API_KEY is in the vault
    enabled: false
    connect_timeout: 60.0
  latitude:
    url: https://api.latitude.so/v1/mcp
    # disabled v1.1.9 — 401; set true when LATITUDE_API_KEY is in the vault
    enabled: false
    headers:
      Authorization: Bearer ${LATITUDE_API_KEY}
  orgo:
    command: npx
    args:
      - -y
      - github:nickvasilescu/orgo-mcp
    env:
      ORGO_API_KEY: ${ORGO_API_KEY}
      ORGO_DEFAULT_COMPUTER_ID: ${ORGO_DEFAULT_COMPUTER_ID}
    # disabled v1.1.12 — 28 tool schemas for remote-VM lifecycle control, on
    # every call, for an assistant whose job is calendar/mail/docs. Jack already
    # runs ON this box; orgo_desktop_* covers local desktop work. Re-enable for
    # fleet management.
    enabled: false
  # Composio Sessions. The entry between the sentinels below is INJECTED at
  # run time by nicks-stack-composio-session, and only once a session has been
  # established and validated. It is deliberately ABSENT otherwise, so Hermes
  # is never handed an empty or stale url — the failure mode is "no Composio
  # tools", never "a broken MCP server". Do not hand-edit between the markers.
  #
  # When active the entry is:
  #     composio: {url: ${COMPOSIO_MCP_URL}, headers: {x-api-key: ${COMPOSIO_API_KEY}}}
  # COMPOSIO_MCP_URL comes from ~/.hermes/composio/mcp.env (0600, derived,
  # re-minted every gateway start). The header value is the Project API key —
  # exactly what session.mcp.headers contains, per the installed SDK's
  # ToolRouter._create_mcp_server_config.
  # >>> composio (runtime-managed) >>>
  # <<< composio <<<
  # ---------------------------------------------------------------------------
  # THE THREE BIG ONES ARE OFF  (v1.1.12)
  # ---------------------------------------------------------------------------
  # MCP tool schemas are billed on every call to every model, exactly like the
  # built-in toolsets, and they were the larger half of the problem. Counted
  # with `hermes mcp test`:
  #
  #     agentmail   25 tools     agentphone  28 tools     orgo  28 tools
  #     obsidian    14 tools     composio     6 tools     x-docs   3 tools
  #
  # 81 of the 106 tools Jack loaded came from three servers he must not or does
  # not use:
  #
  #   agentmail   SOUL.md reserves it for the future autonomous business agents
  #               and forbids Jack from touching the user's mail with it —
  #               "Composio Gmail is the only source". It was connecting anyway
  #               and charging 25 tool schemas per call for a capability the
  #               agent is instructed never to invoke.
  #   agentphone  the bridge is intentionally dormant (no AGENTPHONE_API_KEY);
  #               verify.sh already reports it that way.
  #   orgo        remote-VM lifecycle control. Useful for fleet work, not for
  #               reading Taylor's calendar, and Jack runs ON the box it drives.
  #   x-docs      X/Twitter API documentation. 3 tools, no exec-assistant use.
  #
  # This is the single largest token saving available and it removes no
  # capability Jack was permitted to use. `enabled: true` restores any of them
  # for the next gateway start; keys, urls and env references are untouched.
  agentmail:
    url: https://mcp.agentmail.to/mcp
    # disabled v1.1.12 — 25 tool schemas per call for a server SOUL.md forbids
    # Jack from using. Re-enable when the business agents actually need it.
    enabled: false
    headers:
      x-api-key: ${AGENTMAIL_API_KEY}
  agentphone:
    command: npx
    args:
      - -y
      - agentphone-mcp
    env:
      AGENTPHONE_API_KEY: ${AGENTPHONE_API_KEY}
      AGENTPHONE_BASE_URL: https://api.agentphone.ai
    # disabled v1.1.12 — 28 tool schemas for a bridge with no key (dormant)
    enabled: false
  agent-cards:
    url: https://mcp.agentcard.sh/mcp
    auth: oauth
    # disabled v1.1.9 — OAuth needs an interactive `hermes mcp login agent-cards`
    # that a headless gateway cannot run. Set true after logging in once.
    enabled: false
  x-docs:
    url: https://docs.x.com/mcp
    connect_timeout: 60.0
    # disabled v1.1.12 — X API documentation, 3 tools, no exec-assistant use
    enabled: false
  # xapi (user-context X API via xurl) MUST ship disabled: unconfigured `xurl mcp`
  # opens an interactive browser OAuth on every connect/probe. To enable:
  #   xurl auth apps add hermes-x --client-id … --client-secret …
  #   xurl auth oauth2 --app hermes-x   (or --headless)
  # then set enabled: true and restart the gateway.
  xapi:
    command: xurl
    args:
      - --app
      - hermes-x
      - mcp
      - https://api.x.com/mcp
    connect_timeout: 300.0
    enabled: false
  xapi-app-only:
    url: https://api.x.com/mcp
    headers:
      Authorization: Bearer ${X_APP_ONLY_BEARER_TOKEN}
    # disabled v1.1.9 — 401; set true when X_APP_ONLY_BEARER_TOKEN is in the vault
    enabled: false
    connect_timeout: 120
  linear:
    url: https://mcp.linear.app/mcp
    auth: oauth
    # disabled v1.1.9 — OAuth needs an interactive `hermes mcp login linear`
    # that a headless gateway cannot run. Set true after logging in once.
    enabled: false
  ideabrowser:
    url: https://www.ideabrowser.com/api/mcp/mcp?key=${IDEABROWSER_KEY}
    connect_timeout: 60.0
    # disabled v1.1.9 — ${IDEABROWSER_KEY} is unset, so the url carries an empty
    # key; set true when IDEABROWSER_KEY is in the vault
    enabled: false
  obsidian-vault:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      - /root/Documents/HermesVault
    enabled: true
